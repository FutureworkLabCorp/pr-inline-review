# Sink-sweep patterns, grouped per language. sweep.py loads this file and
# dispatches scanners by file extension. Regexes use TOML *literal* strings
# ('...') so backslashes are taken verbatim (no double-escaping).
#
# Per-language keys:
#   extensions       list of file suffixes that select this language
#   match_shebang    also match extensionless files whose shebang is sh/bash
#   special_scanners named code hooks in sweep.py (AST checks config can't express)
#   [[<lang>.patterns]]  {category, regex, exclude?, paths?}  scanned on ADDED lines only;
#                        `paths` is a regex on the repo-relative file path that limits
#                        the rule to the tree it holds for
#   [<lang>.linter]      {command, parser, runner?, code_map}  external linter lane
#   [<lang>.dead_code]   {def_regex, grep_glob, skip_names?}   added defs w/ 0 external refs
#   comment_regex    a whole-line comment, for the `docs` special scanner
#   removed_regex    a DELETED line matching it enforced something (raise, guard, check,
#                    test); listed under REMOVED unless the same line moved elsewhere

[global]
# Docstrings and comments (the `docs` special scanner), after linkBrain-server's
# .docs/Code-Conventions.md "Docstrings and comments". Only ADDED lines are judged.
#   narration  the change telling its own story: "previously", "this PR", "기존에는"
#   label      a code whose meaning lives elsewhere: FUT-123, Phase 2, D5
#   steps      numbered step comments and banner dividers
#   restate    an Args/Returns header that may only repeat the signature
#   long_*     a candidate, never a verdict: the convention measures information
doc_narration_regex = '(?i)\b(previously|used to|(was|were) changed|we (now|changed|added|fixed|removed|switched)|now (also )?(handles?|returns?|uses?|supports?|accepts?)|this (pr|change|commit|patch)|before this change|after this change|the old (behaviou?r|code|version|implementation)|instead of the old|fix(es|ed)? for|hot ?fix|as of 20\d\d)\b|기존에는|이전에는|예전에는|원래는|이제는|이번 ?(PR|변경|수정|커밋)|수정했|변경했|바꿨|고쳤|추가했|제거했|버그 ?수정'
doc_label_regex = '\b(?!(?:SHA|ISO|UTF|RFC|CVE|HTTP|TLS|SSL|AES|RSA|PEP|GPT|BGE|E5)-)[A-Z]{2,6}-\d{2,5}\b|\b(?:Phase|Stage|Step|Wave)\s*\d+\b|\b(?:P\d+-[a-z]|D\d{1,2}|S-\d+|R-\d+)\b'
doc_steps_regex = '(?i)^\s*(#|//)\s*(\d+[.)]\s|step\s*\d+|\d+\s*단계)|^\s*(#|//)\s*[-=*#~]{4,}'
doc_restate_regex = '^\s*(Args|Arguments|Parameters|Returns|Yields|Raises):\s*$'
doc_long_docstring = 8
doc_long_private_docstring = 3
doc_long_comment_block = 6
# Duplicate changes (DUP-*). DUP-IN-DIFF: the same `dup_window` normalized lines added
# twice. DUP-EXISTING: an added line of `dup_min_line`+ chars and the one after it found
# together elsewhere in the tree, at most `dup_max_greps` lookups. DUP-NAME: an added
# module-level definition whose name is already defined in another file.
dup_window = 4
dup_min_line = 40
dup_max_greps = 40
# Test files: skipped by DUP-* and by the second caller hop (not a production path).
test_paths = '(^|/)tests?/|(^|/)test_[^/]*$|_test\.py$|\.(test|spec)\.tsx?$'
# Review-unit sizing (Python == UNITS ==). A changed function <= size_threshold is read
# whole; a larger one touched only sparsely is read as the hunk's enclosing block, unless
# the diff covers >= coverage_promote of it (then promoted back to a whole read).
unit_size_threshold = 120
unit_coverage_promote = 0.4
unit_max_blocks = 3
# 1 lists the changed function's callers; 2 also their callers (sweep --caller-depth 2).
unit_caller_depth = 1
# Not followed on the second hop: text search would match every unrelated function so named.
unit_common_names = '^(run|execute|main|get|set|update|create|delete|call|handle|process|apply|wrapper|inner|decorator|invoke|dispatch|load|save)$'
unit_callers_max = 5

# Reference resolution for DEAD-CODE and unit callers (Python only). When jedi is
# importable, it replaces the git-grep name search with type-aware references: it
# follows import aliases (`import foo as bar`) and excludes same-named symbols
# defined in other modules — the two blind spots that make a lexical grep both
# over- and under-count references. Scoped to `jedi_roots` for speed: a narrow
# root avoids walking the repo's untracked tree (measured ~10x faster than rooting
# at the repo). Any per-symbol failure, a def outside the roots, or an exhausted
# `jedi_max_symbols` budget falls back to git grep for that symbol; a missing jedi
# install falls back wholesale with a WARNING line. Set jedi_enabled = false to
# force git grep everywhere.
jedi_enabled = true
jedi_roots = ["src"]
jedi_sys_path = ["src"]
jedi_max_symbols = 60

manual_categories = [
  "GRACEFUL-DEGRADATION",
  "NULL-TYPE-SAFETY",
  "CONCURRENCY-ATOMICITY",
  "RESOURCE-HELD-ACROSS-IO",
  "API-TYPE-CORRECTNESS",
  "MERGE-KEY-COLLISION",
]

# --------------------------------------------------------------------------- py
[py]
extensions = [".py"]
removed_regex = '^\s*(raise|assert)\b|^\s*except\b|^\s*if\b.*(\bnot\b|\bis None\b|\bis not\b|\bisinstance\(|\bhasattr\(|[<>]=?|[!=]=)|\b\w*(check|verify|validate|ensure|require|authori[sz]e|permission|forbid|deny|acquire|release|rollback|cleanup|close)\w*\(|^\s*(async\s+)?def\s+test_|^\s*@pytest\.mark\.|^\s*(async\s+)?with\s+.*\b(lock|transaction|begin)\b'
special_scanners = ["loop_isolation", "docs"]
comment_regex = '^\s*#(?!!)'

[[py.patterns]]
category = "SSRF-OUTBOUND"
regex = '\b(httpx|requests|aiohttp|urllib\.request|socket\.(socket|create_connection))\b|\bclient\.(get|post|put|patch|delete|request|stream)\('

[[py.patterns]]
category = "LIFECYCLE-CREATE"
regex = '\b\w*(create|insert|register|acquire|upload)\w*\(|\b(store|put)_\w+\('

[[py.patterns]]
category = "WRITE-AUTH"
regex = '\b(db|session)\.(add|delete|merge)\b|\b(update|delete|remove)_\w+\('

[[py.patterns]]
category = "SILENT-FAILURE"
# A broad catch can turn a real error into a default value nobody sees.
regex = '^\s*except\s*:|^\s*except\s*\(?\s*(Exception|BaseException)\b|suppress\(\s*(Exception|BaseException)\b'
# A catch the author already silenced with a noqa has been decided on; leave it be.
exclude = 'noqa:[^#]*\b(BLE001|S110|E722)\b'

[[py.patterns]]
category = "PY310-COMPAT"
# The code must stay Python 3.10-compatible although requires-python is newer, and
# ruff's target-version only polices syntax, not these stdlib/typing APIs.
regex = '^\s*except\*|\bStrEnum\b|\bdatetime\.UTC\b|from\s+datetime\s+import[^#]*\bUTC\b|^\s*(from\s+tomllib\b|import\s+tomllib\b)|\bExceptionGroup\b|\basyncio\.(TaskGroup|timeout)\b|\bitertools\.batched\b|\btyping\.(Self|override|Never|LiteralString|assert_never|Required|NotRequired|Unpack|TypeVarTuple|dataclass_transform)\b|from\s+typing\s+import[^#]*\b(Self|override|Never|LiteralString|assert_never|Required|NotRequired|Unpack|TypeVarTuple|dataclass_transform)\b|^\s*type\s+\w+(\[[^\]]*\])?\s*=|^\s*(async\s+)?def\s+\w+\[|^\s*class\s+\w+\['
exclude = 'typing_extensions|^\s*#'

[[py.patterns]]
category = "ABS-IMPORT"
# Imports inside src/ are relative; tests and extensions legitimately import src.app.
regex = '^\s*(from|import)\s+src\.app\b'
paths = '^src/'

[[py.patterns]]
category = "CYPHER-COMPAT"
# A graph query has to read the same on Neo4j and ArcadeDB, which silently differ.
regex = '\b(OPTIONAL\s+MATCH|MATCH|MERGE|UNWIND|DETACH\s+DELETE|CALL\s*\{)\s*[\(\{$a-z]'

[py.linter]
command = ["ruff", "check", "--select", "ASYNC,S", "--output-format", "concise", "--no-fix"]
parser = "regex-line"
runner = "uv"
[py.linter.code_map]
ASYNC = "EVENT-LOOP-BLOCKING"
S = "BOUNDARY-VALIDATION"

[py.dead_code]
def_regex = '^\+\s*(?:async\s+)?(?:def|class)\s+([A-Za-z_]\w*)'
grep_glob = "*.py"
skip_names = '^__\w+__$|^test_'

# --------------------------------------------------------------------------- sh
[sh]
extensions = [".sh", ".bash"]
special_scanners = ["docs"]
comment_regex = '^\s*#(?!!)'
removed_regex = '^\s*set\s+-[a-z]*[euo]|\|\|\s*(exit|return)\b|\[\[?\s+-[znfde]\s|^\s*trap\b'
match_shebang = true

[[sh.patterns]]
category = "SH-OUTBOUND"
regex = '\b(curl|wget|nc|ncat)\b'

[[sh.patterns]]
category = "SH-INJECTION"
regex = '\beval\b|\b(bash|sh)\s+-c\b'

[[sh.patterns]]
category = "SH-UNSAFE-RM"
regex = '\brm\s+(-\w+\s+)*[^|;&]*\$'

[[sh.patterns]]
category = "SH-TEMPFILE"
regex = '/tmp/\w'

# --------------------------------------------------------------------------- ts
[ts]
extensions = [".ts", ".tsx"]
special_scanners = ["docs"]
comment_regex = '^\s*(//|/\*|\*)'
removed_regex = '^\s*throw\b|^\s*if\s*\(.*(!|===?|!==?|[<>]=?|\binstanceof\b|\btypeof\b)|\b\w*(check|verify|validate|ensure|require|authori[sz]e|permission|forbid|deny)\w*\(|^\s*(it|test|describe)(\.\w+)?\(|\bcatch\s*\('
# Skip comment-only lines so prose ("renders as a chip", "counts as loading") does not
# trip the word-based patterns below.
skip_lines = '^\s*(?://|\*|/\*)'

[[ts.patterns]]
category = "UNSAFE-CAST"
# `as X` type assertion, excluding the only sanctioned form `as const`.
regex = '\bas\s+(?!const\b)[A-Za-z{[]'
exclude = '^\s*(?:import|export)\b'

[[ts.patterns]]
category = "ANY-ESCAPE"
regex = ':\s*any\b|<any>|\bas\s+any\b|\bany\[\]'

[[ts.patterns]]
category = "NON-NULL-ASSERT"
# foo!.bar / foo()! — the `!` non-null assertion swallows a real null at runtime.
regex = '[\w\)\]]![.\)\];,]'

[[ts.patterns]]
category = "TS-SUPPRESS"
regex = '@ts-ignore\b|@ts-nocheck\b'

[[ts.patterns]]
category = "DANGER-HTML"
regex = 'dangerouslySetInnerHTML'

[ts.linter]
command = ["pnpm", "exec", "eslint", "--format", "json"]
parser = "eslint-json"
# eslint needs the tree's node_modules (plugins/parser/tsconfig). Run it only when
# that is present locally, or when forced with --linter. A worktree checkout of a
# remote PR has no node_modules, so the eslint lane is skipped there by default.
local_only = true
local_bin = "node_modules/.bin/eslint"
[ts.linter.code_map]
"@typescript-eslint/no-floating-promises" = "UNAWAITED-PROMISE"
"@typescript-eslint/no-misused-promises" = "MISUSED-PROMISE"
"@typescript-eslint/no-explicit-any" = "ANY-ESCAPE"
"react-hooks/exhaustive-deps" = "EFFECT-DEPS"
"react-hooks/rules-of-hooks" = "HOOK-RULES"
"jsx-a11y/" = "A11Y"

[ts.dead_code]
def_regex = '^\+\s*export\s+(?:async\s+)?(?:const|function|class)\s+([A-Za-z_]\w*)'
grep_glob = "*.ts*"
